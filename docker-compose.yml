services:
  postgres:
    image: postgres:16
    container_name: voltgrid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltgrid_admin
      POSTGRES_PASSWORD: voltgrid_pass
      POSTGRES_DB: voltgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltgrid_admin -d voltgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: voltgrid_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
